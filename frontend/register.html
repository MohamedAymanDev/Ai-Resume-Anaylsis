<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | AI Resume Analyzer</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>
                AI Resume Analyzer
            </h1>

            <p class="subtitle">
                Create your account
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p id="message"></p>


            <p class="switch-auth">

                Already have an account?

                <a href="./login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="./js/register.js"></script>

</body>

</html>
